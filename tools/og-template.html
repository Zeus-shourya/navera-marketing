<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@400;500&display=block">
<style>
html,body{font-optical-sizing:none;font-variation-settings:"opsz" 14;margin:0;width:1200px;height:630px;overflow:hidden;background:#0c0408}
.og{position:relative;width:1200px;height:630px;overflow:hidden;color:#f2e3d9;font-family:Jost,sans-serif;
  background:radial-gradient(60% 80% at 85% 10%,rgba(201,91,217,.45),transparent 65%),radial-gradient(70% 70% at 0% 100%,rgba(122,22,54,.75),transparent 70%),linear-gradient(140deg,#3f0d20 0%,#1a0710 55%,#250914 100%)}
svg.bg{position:absolute;inset:0;width:1200px;height:630px}
.chrome{background:linear-gradient(100deg,#f8efea 0%,#fff 18%,#dbc8d0 36%,#fff8f4 50%,#e6d5de 64%,#cdb8c4 80%,#f9f0eb 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{position:absolute;left:80px;top:64px;font-family:"Bodoni Moda",serif;font-weight:600;font-size:46px;letter-spacing:-.01em}
.brand small{display:block;font-family:Jost;font-size:13px;letter-spacing:.5em;color:#d2c1c8;margin-top:4px}
.kick{position:absolute;left:80px;top:232px;font-size:17px;letter-spacing:.34em;text-transform:uppercase;color:#dcbdf6}
h1{position:absolute;left:80px;top:270px;width:760px;margin:0;font-family:"Bodoni Moda",serif;font-weight:600;font-size:60px;line-height:1.04;color:#fcf8f4}
h1 em{font-style:italic;background:linear-gradient(100deg,#e7c7ff,#c95bd9 55%,#f0b9e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.foot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;align-items:center;gap:20px;font-size:21px;color:#e9dbe1}
.pill{display:inline-flex;align-items:center;gap:10px;background:#25d366;color:#05301a;font-weight:500;padding:11px 22px;border-radius:999px}
.foot span.sep{opacity:.4}
</style></head><body><div class="og">
<svg class="bg" viewBox="0 0 1200 630">
 <defs><linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#f3e3ea" stop-opacity=".9"/><stop offset=".7" stop-color="#c95bd9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="b"><feGaussianBlur stdDeviation="30"/></filter></defs>
 <path d="M500 700 C 700 520 900 640 1260 420 L1260 700Z" fill="#7a1636" opacity=".55" filter="url(#b)"/>
 <ellipse cx="960" cy="320" rx="300" ry="96" transform="rotate(-18 960 320)" fill="none" stroke="url(#r)" stroke-width="2"/>
 <ellipse cx="960" cy="320" rx="250" ry="70" transform="rotate(-12 960 320)" fill="none" stroke="url(#r)" stroke-width="1" opacity=".5"/>
 <text x="960" y="380" text-anchor="middle" font-family="Bodoni Moda, serif" font-size="230" fill="#fff" fill-opacity=".9">N</text>
 <path transform="translate(1062 150) scale(2.4)" fill="#fff" d="M12 0c.6 6.2 1.9 9.9 5.4 11.2.9.3 2.2.6 6.6.8-4.4.2-5.7.5-6.6.8-3.5 1.3-4.8 5-5.4 11.2-.6-6.2-1.9-9.9-5.4-11.2C5.7 12.5 4.4 12.2 0 12c4.4-.2 5.7-.5 6.6-.8C10.1 9.9 11.4 6.2 12 0Z"/>
 <g stroke="#fff" stroke-opacity=".07"><path d="M300 -10 L 620 640"/><path d="M760 -10 L 1080 640"/></g>
</svg>
<div class="brand chrome">Navera<small>MARKETING</small></div>
<div class="kick">{{kicker}}</div>
<h1>{{headline}}</h1>
<div class="foot"><span class="pill">WhatsApp +91 {{phone}}</span><span>Sonipat, Haryana</span><span class="sep">&bull;</span><span>@navera.marketing</span></div>
</div></body></html>
