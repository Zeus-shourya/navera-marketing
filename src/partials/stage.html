<div class="stage" aria-hidden="true">
  <svg class="orbit-big" viewBox="0 0 600 612">
    <defs>
      <linearGradient id="st-ring" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#f3e3ea" stop-opacity=".95"/><stop offset=".62" stop-color="#c95bd9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <radialGradient id="st-glow"><stop offset="0" stop-color="#c95bd9" stop-opacity=".5"/><stop offset=".55" stop-color="#7a1636" stop-opacity=".25"/><stop offset="1" stop-color="#7a1636" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="300" cy="306" r="280" fill="url(#st-glow)"/>
    <g class="ring">
      <ellipse cx="300" cy="306" rx="296" ry="98" transform="rotate(-20 300 306)" fill="none" stroke="url(#st-ring)" stroke-width="1.6"/>
      <ellipse cx="300" cy="306" rx="262" ry="74" transform="rotate(-14 300 306)" fill="none" stroke="url(#st-ring)" stroke-width=".7" opacity=".45"/>
    </g>
    <use href="#i-spark" class="twinkle" x="478" y="62" width="50" height="50" style="color:#fff"/>
    <use href="#i-spark" class="twinkle" x="60" y="440" width="22" height="22" style="color:#dcbdf6;animation-delay:-1.4s"/>
    <use href="#i-spark" class="twinkle" x="540" y="380" width="16" height="16" style="color:#f3e3ea;animation-delay:-2.2s"/>
  </svg>
  {{part:phone}}
  <svg class="orbit-big" viewBox="0 0 600 612" style="pointer-events:none">
    <g class="ring"><g transform="rotate(-20 300 306)"><path d="M4 306 A296 98 0 0 0 596 306" fill="none" stroke="url(#st-ring)" stroke-width="1.6"/></g></g>
  </svg>
  <div class="float-card glass fc-msg">
    <span class="wa-dot"><svg aria-hidden="true"><use href="#i-wa"/></svg></span>
    <div><b>New enquiry</b><span>&ldquo;Hi! Saw your reel. Is the offer still on?&rdquo;</span></div>
  </div>
  <div class="float-card glass fc-search">
    <small>Google search</small>
    <div class="bar"><svg aria-hidden="true"><use href="#i-seo"/></svg>best caf&eacute; in sonipat</div>
    <div class="res"><span class="pin"><svg aria-hidden="true"><use href="#i-pin"/></svg></span><div><b>Your Brand</b><span>&#9733;&#9733;&#9733;&#9733;&#9733;</span><em>Open now</em></div></div>
  </div>
  <div class="float-card glass fc-reach">
    <div class="row"><small>Monthly reach</small><span class="up">&#9650; growing</span></div>
    <svg viewBox="0 0 200 56" preserveAspectRatio="none">
      <defs><linearGradient id="st-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c95bd9" stop-opacity=".55"/><stop offset="1" stop-color="#c95bd9" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 50 C 25 46, 35 40, 55 42 S 90 30, 110 30 S 150 14, 170 12 S 190 4, 200 2 V56 H0Z" fill="url(#st-area)"/>
      <path d="M0 50 C 25 46, 35 40, 55 42 S 90 30, 110 30 S 150 14, 170 12 S 190 4, 200 2" fill="none" stroke="#f0c4ff" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="200" cy="2" r="4" fill="#fff"/>
    </svg>
  </div>
  <span class="chip glass chip-1"><svg aria-hidden="true"><use href="#i-video"/></svg>Reels</span>
  <span class="chip glass chip-2"><svg aria-hidden="true"><use href="#i-seo"/></svg>Local SEO</span>
</div>
